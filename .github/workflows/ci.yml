name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Форматирование
        run: dart format --set-exit-if-changed lib test

      - name: Анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test

      - name: Релизная сборка
        run: flutter build web --release
