name: Pages

# Сайт живёт по адресу https://hecatoncheir.github.io/pccase/,
# поэтому сборке нужен base href с именем репозитория.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно катим только один деплой, очередь не копим.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Релизная сборка
        run: flutter build web --release --base-href /pccase/

      - name: Отдать статику как есть
        run: |
          # Без этого GitHub Pages прогоняет вывод через Jekyll и выкидывает папки с подчёркиванием.
          touch build/web/.nojekyll
          # Ссылка на сборку — обычный путь без решётки, так что неизвестный адрес
          # должен открыть то же приложение, а не страницу ошибки.
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
